[package]
name = "windsurf-cascade-proxy"
version = "0.2.0"
description = "Windsurf Cascade native relay manager"
authors = ["Windsurf Cascade Proxy"]
edition = "2021"

[features]
experimental-macos-patching = []

[lib]
name = "windsurf_cascade_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
hex = "0.4"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.35"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
tokio = { version = "1", features = ["process", "sync", "time", "fs", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
