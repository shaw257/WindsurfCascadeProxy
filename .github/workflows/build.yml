name: Windows Tauri Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Test proxy core
        run: npm test
      - name: Test Rust backend
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --lib
      - name: Build Windows installer
        run: npm run tauri -- build --bundles nsis --ci
